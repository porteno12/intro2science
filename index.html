<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2E7D52">
  <title>שאלוני מבוא למדעים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#16261D; --lab:#2E7D52; --lab-deep:#1F5B3A; --mist:#EDF5EE; --flask:#E85D2A; --muted:#5B7566; --line:#D3E4D7; }
    * { box-sizing:border-box; }
    body {
      margin:0; color:var(--ink); font-family:Heebo,sans-serif; background-color:#F6FBF7;
      background-image:
        radial-gradient(circle at 12% 8%, rgba(46,125,82,.10), transparent 24rem),
        radial-gradient(circle at 90% 4%, rgba(232,93,42,.09), transparent 26rem);
    }
    .wrap { width:min(900px, calc(100% - 32px)); margin:auto; padding:56px 0 64px; }
    .brand { display:flex; align-items:center; gap:10px; color:var(--lab); font-weight:800; font-size:15px; letter-spacing:.02em; }
    .brand .dot { width:11px; height:11px; border-radius:50%; background:var(--flask); box-shadow:0 0 0 4px rgba(232,93,42,.16); }
    h1 { font-size:clamp(34px,7vw,60px); margin:16px 0 10px; color:var(--lab-deep); letter-spacing:-.02em; font-weight:800; }
    .sub { color:var(--muted); font-weight:600; font-size:17px; line-height:1.7; margin:0 0 34px; }
    .lesson {
      display:block; padding:26px 28px; color:inherit; text-decoration:none; background:#fff;
      border:1px solid var(--line); border-radius:18px; box-shadow:0 14px 34px rgba(31,91,58,.09);
      transition:transform .18s, box-shadow .18s, border-color .18s;
    }
    .lesson:hover { transform:translateY(-3px); border-color:var(--lab); box-shadow:0 20px 44px rgba(31,91,58,.16); }
    .lesson:focus-visible { outline:3px solid var(--flask); outline-offset:3px; }
    .tag { color:var(--flask); font-weight:800; font-size:14px; letter-spacing:.04em; }
    .lesson h2 { margin:8px 0 6px; font-size:27px; color:var(--lab-deep); font-weight:800; }
    .lesson span { color:var(--muted); font-weight:600; line-height:1.7; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .chip { padding:5px 11px; border-radius:999px; background:var(--mist); border:1px solid var(--line); color:var(--lab-deep); font-weight:700; font-size:12.5px; }
    @media (prefers-reduced-motion: reduce) { .lesson:hover { transform:none; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><span class="dot"></span><span>מבוא למדעים · י׳</span></div>
    <h1>שאלוני מבוא למדעים</h1>
    <p class="sub">רוני רובן · תשפ״ז</p>
    <a class="lesson" href="research-question/">
      <div class="tag">מבוא למדעים</div>
      <h2>שאלת חקר והתהליך המדעי</h2>
      <span>שאלת חקר, משתנים, השערה, שיטות מחקר, חשיבה ביקורתית ואתיקה מדעית</span>
      <div class="chips">
        <span class="chip">20 שאלות</span>
        <span class="chip">סף מעבר: 60</span>
      </div>
    </a>
  </main>
</body>
</html>
